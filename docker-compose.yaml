# Aplicação Node.js conectada ao banco de dados no Coolify:
services:
  app:
    build: .
    restart: always
    networks:
      - default
      - coolify
    environment:
      DB_HOST: ${DB_HOST:-nii1smqkgzjw7dymsv4pm2bn}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-oticas}
      DB_PASSWORD: ${DB_PASSWORD:-oticas_senha_segura}
      DB_NAME: ${DB_NAME:-oticas_montagens}
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:-oticas_unico_session_secret_64_chars_key_2026}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: "true"
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  coolify:
    name: coolify
    external: true

